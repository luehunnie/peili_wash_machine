# 部署到 GitHub Pages —— 官方 Actions 组合（文档：https://docs.github.com/actions/deployments/deploying-to-github-pages）
# 开通前提（一次性）：仓库 Settings → Pages → Source 选择 "GitHub Actions"
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署所需的最小权限（官方模板）
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个 Pages 部署，不取消进行中的部署（官方模板写法）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
